<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - Blitz Deutsch</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f9fc;
            color: #1f2937;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            height: 70px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #e5e7eb;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            white-space: nowrap;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 22px;
        }

        .nav-links a {
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #2563eb;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 800px;
            margin: 45px auto;
            padding: 0 20px;
        }


        /* =========================
           START SCREEN
        ========================= */

        .start-screen {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 28px;

            padding: 60px 30px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .start-icon {
            font-size: 75px;
            margin-bottom: 20px;
        }

        .start-screen h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .start-screen h1 span {
            color: #2563eb;
        }

        .start-screen p {
            color: #6b7280;

            max-width: 550px;

            margin: 0 auto 30px;

            line-height: 1.7;
        }

        .start-info {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin: 30px 0;
        }

        .info-box {
            background: #f8fafc;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 15px;
        }

        .info-box div:first-child {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .info-box small {
            color: #6b7280;
        }

        .start-btn {
            border: none;

            background: #2563eb;

            color: white;

            padding: 16px 35px;

            border-radius: 15px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .start-btn:hover {
            background: #1d4ed8;

            transform: translateY(-2px);
        }


        /* =========================
           QUIZ HEADER
        ========================= */

        .quiz-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .level {
            background: #eff6ff;

            color: #2563eb;

            padding: 8px 15px;

            border-radius: 20px;

            font-size: 14px;

            font-weight: bold;
        }

        .stats {
            display: flex;

            gap: 8px;
        }

        .stat {
            background: white;

            border: 1px solid #e5e7eb;

            padding: 8px 13px;

            border-radius: 12px;

            font-size: 14px;

            font-weight: bold;
        }


        /* =========================
           TIMER
        ========================= */

        .timer-container {
            margin-bottom: 25px;
        }

        .timer-info {
            display: flex;

            justify-content: space-between;

            margin-bottom: 7px;

            color: #6b7280;

            font-size: 14px;
        }

        .timer-bar {
            height: 9px;

            background: #e5e7eb;

            border-radius: 20px;

            overflow: hidden;
        }

        .timer-fill {
            width: 100%;

            height: 100%;

            background: #2563eb;

            border-radius: 20px;

            transition:
                width 1s linear;
        }


        /* =========================
           QUESTION
        ========================= */

        .question-card {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 28px;

            padding: 45px 30px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .question-label {
            color: #9ca3af;

            font-size: 14px;

            margin-bottom: 15px;
        }

        .question {
            font-size: 48px;

            font-weight: 800;

            margin-bottom: 10px;
        }

        .question-description {
            color: #6b7280;

            margin-bottom: 20px;
        }

        .speak-btn {
            border: none;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            background: #eff6ff;

            color: #2563eb;

            font-size: 21px;

            cursor: pointer;

            margin-bottom: 30px;
        }

        .speak-btn:hover {
            background: #dbeafe;
        }


        /* =========================
           OPTIONS
        ========================= */

        .options {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }

        .option {
            border: 2px solid #e5e7eb;

            background: white;

            border-radius: 15px;

            padding: 18px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .option:hover {
            border-color: #2563eb;

            background: #eff6ff;
        }

        .option.correct {
            background: #dcfce7;

            border-color: #22c55e;

            color: #166534;
        }

        .option.wrong {
            background: #fee2e2;

            border-color: #ef4444;

            color: #991b1b;
        }

        .option:disabled {
            cursor: default;
        }


        /* =========================
           FEEDBACK
        ========================= */

        .feedback {
            min-height: 30px;

            margin-top: 20px;

            font-size: 17px;

            font-weight: bold;
        }

        .feedback.correct {
            color: #16a34a;
        }

        .feedback.wrong {
            color: #dc2626;
        }


        /* =========================
           GAME OVER
        ========================= */

        .game-over {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 28px;

            padding: 50px 30px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .trophy {
            font-size: 80px;

            margin-bottom: 15px;
        }

        .game-over h1 {
            font-size: 42px;

            margin-bottom: 10px;
        }

        .game-over p {
            color: #6b7280;

            margin-bottom: 30px;
        }

        .results {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }

        .result {
            background: #f3f4f6;

            border-radius: 15px;

            padding: 20px;
        }

        .result span {
            display: block;

            color: #6b7280;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .result strong {
            font-size: 30px;

            color: #2563eb;
        }

        .game-buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .progress-btn {
            display: inline-block;

            padding: 16px 25px;

            background: #eff6ff;

            color: #2563eb;

            border-radius: 15px;

            text-decoration: none;

            font-weight: bold;
        }

        .progress-btn:hover {
            background: #dbeafe;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 0 15px;
            }

            .nav-links {
                gap: 8px;
            }

            .nav-links a {
                font-size: 10px;
            }

            .logo {
                font-size: 17px;
            }

            .container {
                margin-top: 30px;
            }

            .start-screen {
                padding: 45px 20px;
            }

            .start-screen h1 {
                font-size: 32px;
            }

            .start-info {
                grid-template-columns: 1fr;
            }

            .quiz-header {
                align-items: flex-start;
            }

            .stats {
                flex-wrap: wrap;

                justify-content: flex-end;
            }

            .stat {
                font-size: 11px;

                padding: 7px 9px;
            }

            .question-card {
                padding: 35px 18px;
            }

            .question {
                font-size: 38px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

        </div>

    <!-- =========================

    <main class="container">

        <div id="game"></div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =================================
           VOCABULARY
        ================================= */

        const vocabulary = [

            {
                de: "Hallo",
                id: "Halo"
            },

            {
                de: "Guten Tag",
                id: "Selamat siang"
            },

            {
                de: "Danke",
                id: "Terima kasih"
            },

            {
                de: "Bitte",
                id: "Sama-sama / Silakan"
            },

            {
                de: "Auf Wiedersehen",
                id: "Sampai jumpa lagi"
            },

            {
                de: "der Name",
                id: "Nama"
            },

            {
                de: "Ich heiße",
                id: "Nama saya"
            },

            {
                de: "woher",
                id: "Dari mana"
            },

            {
                de: "wohnen",
                id: "Tinggal"
            },

            {
                de: "die Sprache",
                id: "Bahasa"
            },

            {
                de: "lernen",
                id: "Belajar"
            },

            {
                de: "das Wasser",
                id: "Air"
            },

            {
                de: "das Brot",
                id: "Roti"
            },

            {
                de: "essen",
                id: "Makan"
            },

            {
                de: "trinken",
                id: "Minum"
            },

            {
                de: "die Musik",
                id: "Musik"
            },

            {
                de: "das Buch",
                id: "Buku"
            },

            {
                de: "arbeiten",
                id: "Bekerja"
            },

            {
                de: "die Stadt",
                id: "Kota"
            },

            {
                de: "der Freund",
                id: "Teman"
            }

        ];


        /* =================================
           GAME VARIABLES
        ================================= */

        let score = 0;

        let lives = 3;

        let level = 1;

        let streak = 0;

        let maxStreak = 0;

        let currentQuestion = null;

        let timer = 15;

        let timerInterval = null;

        let answerLocked = false;


        /* =================================
           SHUFFLE
        ================================= */

        function shuffle(array) {

            const result = [...array];

            for (
                let i = result.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );

                [
                    result[i],
                    result[j]
                ] = [
                    result[j],
                    result[i]
                ];

            }

            return result;

        }


        /* =================================
           START GAME
        ================================= */

        function startGame() {

            clearInterval(timerInterval);

            score = 0;

            lives = 3;

            level = 1;

            streak = 0;

            maxStreak = 0;

            answerLocked = false;

            showQuestion();

        }


        /* =================================
           GENERATE QUESTION
        ================================= */

        function showQuestion() {

            clearInterval(timerInterval);

            answerLocked = false;

            const randomIndex =
                Math.floor(
                    Math.random() *
                    vocabulary.length
                );

            currentQuestion =
                vocabulary[randomIndex];


            const wrongAnswers =
                shuffle(
                    vocabulary.filter(
                        word =>
                            word.de !==
                            currentQuestion.de
                    )
                ).slice(0, 3);


            const options =
                shuffle([
                    currentQuestion,
                    ...wrongAnswers
                ]);


            timer =
                Math.max(
                    15 -
                    ((level - 1) * 1),
                    5
                );


            document.getElementById(
                "game"
            ).innerHTML = `

                <div class="quiz-header">

                    <div class="level">
                        Level ${level}
                    </div>

                    <div class="stats">

                        <div class="stat">
                            ❤️ ${lives}
                        </div>

                        <div class="stat">
                            ⭐ ${score}
                        </div>

                        <div class="stat">
                            🔥 ${streak}
                        </div>

                    </div>

                </div>


                <div class="timer-container">

                    <div class="timer-info">

                        <span>
                            Time Remaining
                        </span>

                        <strong id="timer">
                            ${timer}s
                        </strong>

                    </div>

                    <div class="timer-bar">

                        <div
                            id="timerFill"
                            class="timer-fill"
                        ></div>

                    </div>

                </div>


                <div class="question-card">

                    <div class="question-label">
                        Apa arti kata berikut?
                    </div>

                    <div class="question">
                        ${currentQuestion.de}
                    </div>

                    <div class="question-description">
                        Pilih arti bahasa Indonesia
                        yang paling tepat.
                    </div>

                    <button
                        class="speak-btn"
                        onclick="speakGerman()"
                        title="Dengarkan pronunciation"
                    >
                        🔊
                    </button>


                    <div class="options">

                        ${options.map(
                            option => `

                            <button
                                class="option"
                                onclick="selectAnswer(
                                    '${escapeQuotes(option.id)}',
                                    this
                                )"
                            >
                                ${option.id}
                            </button>

                        `).join("")}

                    </div>


                    <div
                        id="feedback"
                        class="feedback"
                    ></div>

                </div>

            `;


            startTimer();

        }


        /* =================================
           ESCAPE QUOTES
        ================================= */

        function escapeQuotes(text) {

            return text
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }


        /* =================================
           TIMER
        ================================= */

        function startTimer() {

            updateTimerDisplay();


            timerInterval =
                setInterval(
                    function () {

                        if (answerLocked) {

                            clearInterval(
                                timerInterval
                            );

                            return;

                        }


                        timer--;

                        updateTimerDisplay();


                        if (timer <= 0) {

                            clearInterval(
                                timerInterval
                            );

                            timeOut();

                        }

                    },
                    1000
                );

        }


        function updateTimerDisplay() {

            const timerText =
                document.getElementById(
                    "timer"
                );

            const timerFill =
                document.getElementById(
                    "
