<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - Blitz Deutsch</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f7f9fc;
            color: #1f2937;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: white;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #e5e7eb;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #2563eb;
        }


        /* =========================
           GAME CONTAINER
        ========================= */

        .container {
            max-width: 800px;

            margin: 45px auto;

            padding: 0 20px;
        }


        /* =========================
           QUIZ HEADER
        ========================= */

        .quiz-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .level {
            background: #eff6ff;

            color: #2563eb;

            padding: 8px 15px;

            border-radius: 20px;

            font-weight: bold;
        }

        .stats {
            display: flex;

            gap: 15px;
        }

        .stat {
            background: white;

            border: 1px solid #e5e7eb;

            padding: 8px 14px;

            border-radius: 12px;

            font-weight: bold;
        }


        /* =========================
           TIMER
        ========================= */

        .timer-container {
            margin-bottom: 25px;
        }

        .timer-info {
            display: flex;

            justify-content: space-between;

            margin-bottom: 7px;

            font-size: 14px;

            color: #6b7280;
        }

        .timer-bar {
            height: 10px;

            background: #e5e7eb;

            border-radius: 20px;

            overflow: hidden;
        }

        .timer-fill {
            height: 100%;

            width: 100%;

            background: #2563eb;

            transition: width 1s linear;
        }


        /* =========================
           QUESTION CARD
        ========================= */

        .question-card {
            background: white;

            border-radius: 25px;

            padding: 45px 35px;

            border: 1px solid #e5e7eb;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.05);
        }

        .question-label {
            color: #9ca3af;

            font-size: 14px;

            margin-bottom: 15px;
        }

        .question {
            font-size: 48px;

            font-weight: 800;

            margin-bottom: 10px;
        }

        .question-meaning {
            color: #6b7280;

            margin-bottom: 25px;
        }

        .speak-btn {
            border: none;

            background: #eff6ff;

            color: #2563eb;

            width: 50px;

            height: 50px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 20px;

            margin-bottom: 30px;
        }

        .speak-btn:hover {
            background: #dbeafe;
        }


        /* =========================
           OPTIONS
        ========================= */

        .options {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }

        .option {
            background: white;

            border: 2px solid #e5e7eb;

            padding: 18px;

            border-radius: 15px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;

            transition: 0.2s;
        }

        .option:hover {
            border-color: #2563eb;

            background: #eff6ff;
        }

        .option.correct {
            background: #dcfce7;

            border-color: #22c55e;

            color: #166534;
        }

        .option.wrong {
            background: #fee2e2;

            border-color: #ef4444;

            color: #991b1b;
        }

        .option.disabled {
            pointer-events: none;

            opacity: 0.6;
        }


        /* =========================
           FEEDBACK
        ========================= */

        .feedback {
            margin-top: 20px;

            min-height: 25px;

            font-weight: bold;

            font-size: 18px;
        }

        .feedback.correct {
            color: #16a34a;
        }

        .feedback.wrong {
            color: #dc2626;
        }


        /* =========================
           START SCREEN
        ========================= */

        .start-screen {
            text-align: center;

            background: white;

            border-radius: 25px;

            padding: 60px 30px;

            border: 1px solid #e5e7eb;
        }

        .start-icon {
            font-size: 75px;

            margin-bottom: 20px;
        }

        .start-screen h1 {
            font-size: 40px;

            margin-bottom: 15px;
        }

        .start-screen p {
            color: #6b7280;

            line-height: 1.6;

            max-width: 500px;

            margin: auto auto 30px;
        }

        .start-btn {
            border: none;

            background: #2563eb;

            color: white;

            padding: 16px 35px;

            border-radius: 15px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .start-btn:hover {
            background: #1d4ed8;
        }


        /* =========================
           GAME OVER
        ========================= */

        .game-over {
            text-align: center;

            background: white;

            border-radius: 25px;

            padding: 50px 30px;

            border: 1px solid #e5e7eb;
        }

        .trophy {
            font-size: 80px;

            margin-bottom: 20px;
        }

        .game-over h1 {
            font-size: 42px;

            margin-bottom: 10px;
        }

        .game-over p {
            color: #6b7280;

            margin-bottom: 30px;
        }

        .results {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }

        .result {
            background: #f3f4f6;

            padding: 20px;

            border-radius: 15px;
        }

        .result span {
            display: block;

            color: #6b7280;

            font-size: 13px;

            margin-bottom: 5px;
        }

        .result strong {
            font-size: 30px;

            color: #2563eb;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 0 15px;
            }

            .nav-links {
                gap: 9px;
            }

            .nav-links a {
                font-size: 10px;
            }

            .quiz-header {
                align-items: flex-start;

                gap: 10px;
            }

            .stats {
                gap: 5px;
            }

            .stat {
                padding: 7px 9px;

                font-size: 12px;
            }

            .question-card {
                padding: 35px 20px;
            }

            .question {
                font-size: 38px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .start-screen h1 {
                font-size: 32px;
            }

            .results {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>

        <div class="logo">
            Blitz <span>Deutsch</span> 🇩🇪
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="vocabulary.html">
                Vocabulary
            </a>

            <a href="phrases.html">
                Phrases
            </a>

            <a href="quiz.html">
                Quiz
            </a>

            <a href="progress.html">
                Progress
            </a>

        </div>

    </nav>


    <!-- =========================
         GAME
    ========================= -->

    <main class="container">

        <div id="game"></div>

    </main>


    <script>

        /* =========================
           VOCABULARY DATA
        ========================= */

        const vocabulary = [

            {
                de: "Hallo",
                id: "Halo"
            },

            {
                de: "Danke",
                id: "Terima kasih"
            },

            {
                de: "Bitte",
                id: "Sama-sama / Silakan"
            },

            {
                de: "Wasser",
                id: "Air"
            },

            {
                de: "Brot",
                id: "Roti"
            },

            {
                de: "Freund",
                id: "Teman"
            },

            {
                de: "Buch",
                id: "Buku"
            },

            {
                de: "Musik",
                id: "Musik"
            },

            {
                de: "Stadt",
                id: "Kota"
            },

            {
                de: "lernen",
                id: "Belajar"
            },

            {
                de: "essen",
                id: "Makan"
            },

            {
                de: "trinken",
                id: "Minum"
            },

            {
                de: "arbeiten",
                id: "Bekerja"
            },

            {
                de: "wohnen",
                id: "Tinggal"
            },

            {
                de: "die Sprache",
                id: "Bahasa"
            }

        ];


        /* =========================
           GAME VARIABLES
        ========================= */

        let score = 0;

        let lives = 3;

        let streak = 0;

        let maxStreak = 0;

        let level = 1;

        let time = 15;

        let timer;

        let currentQuestion;

        let locked = false;


        /* =========================
           SHUFFLE
        ========================= */

        function shuffle(array) {

            return array.sort(
                () => Math.random() - 0.5
            );

        }


        /* =========================
           START GAME
        ========================= */

        function startGame() {

            score = 0;

            lives = 3;

            streak = 0;

            maxStreak = 0;

            level = 1;

            showQuestion();

        }


        /* =========================
           SHOW QUESTION
        ========================= */

        function showQuestion() {

            locked = false;

            time =
                Math.max(
                    15 - (level - 1),
                    5
                );


            currentQuestion =
                vocabulary[
                    Math.floor(
                        Math.random()
                        *
                        vocabulary.length
                    )
                ];


            let wrongAnswers =
                vocabulary
                    .filter(
                        word =>
                            word.de !==
                            currentQuestion.de
                    );


            wrongAnswers =
                shuffle(wrongAnswers)
                .slice(0, 3);


            let options =
                shuffle([
                    currentQuestion,
                    ...wrongAnswers
                ]);


            document.getElementById(
                "game"
            ).innerHTML = `

                <div class="quiz-header">

                    <div class="level">
                        Level ${level}
                    </div>

                    <div class="stats">

                        <div class="stat">
                            ❤️ ${lives}
                        </div>

                        <div class="stat">
                            ⭐ ${score}
                        </div>

                        <div class="stat">
                            🔥 ${streak}
                        </div>

                    </div>

                </div>


                <div class="timer-container">

                    <div class="timer-info">

                        <span>
                            Time
                        </span>

                        <strong id="timer">
                            ${time}s
                        </strong>

                    </div>

                    <div class="timer-bar">

                        <div
                            id="timerFill"
                            class="timer-fill"
                        ></div>

                    </div>

                </div>


                <div class="question-card">

                    <div class="question-label">
                        What does this word mean?
                    </div>

                    <div class="question">
                        ${currentQuestion.de}
                    </div>

                    <div class="question-meaning">
                        Pilih arti yang benar
                    </div>

                    <button
                        class="speak-btn"
                        onclick="speak('${currentQuestion.de}')"
                    >
                        🔊
                    </button>


                    <div class="options">

                        ${options.map(
                            option => `

                            <button
                                class="option"
                                onclick="answer(
                                    '${option.id}',
                                    this
                                )"
                            >
                                ${option.id}
                            </button>

                        `).join("")}

                    </div>


                    <div
                        id="feedback"
                        class="feedback"
                    ></div>

                </div>

            `;


            startTimer();

        }


        /* =========================
           TIMER
        ========================= */

        function startTimer() {

            clearInterval(timer);

            updateTimer();


            timer =
                setInterval(() => {

                    time--;

                    updateTimer();


                    if (time <= 0) {

                        clearInterval(timer);

                        wrongAnswer(
                            null,
                            true
                        );

                    }

                }, 1000);

        }


        function updateTimer() {

            const timerText =
                document.getElementById(
                    "timer"
                );

            const timerFill =
                document.getElementById(
                    "timerFill"
                );


            if (!timerText) return;


            timerText.innerText =
                time + "s";


            const percentage =
                (time / 15) * 100;


            timerFill.style.width =
                percentage + "%";

        }


        /* =========================
           ANSWER
        ========================= */

        function answer(
            selected,
            button
        ) {

            if (locked) return;

            locked = true;

            clearInterval(timer);


            if (
                selected ===
                currentQuestion.id
            ) {

                correctAnswer(button);

            } else {

                wrongAnswer(button);

            }

        }


        /* =========================
           CORRECT
        ========================= */

        function correctAnswer(button) {

            streak++;

            if (
                streak >
                maxStreak
            ) {

                maxStreak =
                    streak;

            }


            const points =
                (10 * level)
                +
                (streak * 5);


            score += points;


            button.classList.add(
                "correct"
            );


            const feedback =
                document.getElementById(
                    "feedback"
                );


            feedback.innerText =
                "🎉 Correct! +" +
                points +
                " XP";

            feedback.className =
                "feedback correct";


            speak(
                currentQuestion.de
            );


            if (
                streak % 5 === 0
            ) {

                level++;

            }


            setTimeout(
                showQuestion,
                1200
            );

        }


        /* =========================
           WRONG
        ========================= */

        function wrongAnswer(
            button,
            timeout = false
        ) {

            if (locked &&
                !timeout) return;


            locked = true;

            clearInterval(timer);


            lives--;

            streak = 0;


            if (button) {

                button.classList.add(
                    "wrong"
                );

            }


            const feedback =
                document.getElementById(
                    "feedback"
                );


            if (timeout) {

                feedback.innerText =
                    "⏰ Time's up!";

            } else {

                feedback.innerText =
                    "❌ Wrong answer!";

            }


            feedback.className =
                "feedback wrong";


            if (lives <= 0) {

                setTimeout(
                    gameOver,
                    1000
                );

            } else {

                setTimeout(
                    showQuestion,
                    1200
                );

            }

        }


        /* =========================
           GAME OVER
        ========================= */

        function gameOver() {

            clearInterval(timer);


            document.getElementById(
                "game"
            ).innerHTML = `

                <div class="game-over">

                    <div class="trophy">
                        🏆
                    </div>

                    <h1>
                        Game Over!
                    </h1>

                    <p>
                        Gute Arbeit!
                        Terus latihan b
